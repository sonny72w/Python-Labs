{% extends 'base.html'%}
{%block head%}
<title>Edit/Duty Assignments</title>
<link rel = "stylesheet" href="{{url_for('static', filename="style.css")}}" />
{% endblock %}
    
{% block body %}
</head>
<body>
    <div class = "to-do">
        <h4>Update the list</h4>

        </form>

    </div>
    
{% endblock %}
</body>
</html>
